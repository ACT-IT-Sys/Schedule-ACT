<article class="cp-glass" data-print>
  <div class="plate" data-plate>
    <section class="cg-card">
      <!-- Angled cream overlay background shape -->
      <div class="cg-split-bg"></div>

      <!-- Top/Left Section ($TITLE & Flex Vessel/Voyage Group) -->
      <div class="cg-section-top">
        <strong class="cg-brand cg-split-text" data-field="title"></strong>

        <div class="cg-vessel-voyage-group">
          <div class="cg-kv">
            <span class="cg-v cg-split-text" data-field="vessel"></span>
          </div>
          <span class="cg-tilde cg-split-text">~</span>
          <div class="cg-kv">
            <span class="cg-v cg-split-text" data-field="voyage"></span>
          </div>
        </div>
      </div>

      <!-- Center / Route Section (Origin to Destination with Split Inversion Effect) -->
      <div class="cg-section-mid">
        <h2 class="cg-split-text" data-field="origin"></h2>
        <span class="cg-to-label cg-split-text">TO</span>
        <p class="cg-stem">
          <span class="cg-split-text" data-field="destination"></span>
        </p>
      </div>

      <!-- Right Section (ETD & ETA) -->
      <div class="cg-section-right">
        <div class="cg-date-block">
          <span class="cg-k" data-label="DEPART"></span>
          <span class="cg-date" data-field="etd"></span>
        </div>
        <div class="cg-date-block">
          <span class="cg-k" data-label="ARRIVAL"></span>
          <span class="cg-date" data-field="eta"></span>
        </div>
      </div>
    </section>
  </div>
</article>
