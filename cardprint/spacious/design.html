<div class="cp-flyer" data-print>
  <div class="plate" data-plate>
    <div class="flyer-container">
      <!-- Header -->
      <header class="flyer-header">
        <div class="brand-logo-group">
          <div class="logo-mark">
            <img src="bg/icon/LOGO-1x1.webp" alt="ACT" />
          </div>
          <div class="logo-text">
            <span class="logo-title">AGLOFRE LOGISTICS</span>
            <span class="logo-sub">Your Logistic Provider</span>
          </div>
        </div>
        <!-- <div class="badges-group">
          <div class="iso-badge">ISO<br />9001:2015</div>
          <div class="halal-badge">
            HALAL<br /><small>ID31210020<br />524931024</small>
          </div>
        </div> -->
      </header>

      <!-- Main Right-Aligned Column -->
      <main class="flyer-body">
        <div class="flyer-titles">
          <h1 class="main-title" data-field="title">LCL IMPORT</h1>
          <div class="route-pill" data-hide-empty>
            <span data-field="origin"></span> to
            <span data-field="destination"></span>
          </div>
        </div>

        <div class="details-card">
          <div class="detail-row" data-hide-empty>
            <div class="detail-icon">
              <img src="bg/icon/vessel.svg" alt="Vessel" />
            </div>
            <div class="detail-content">
              <span class="detail-label" data-label="vessel">Vessel</span>
              <span class="detail-value" data-field="vessel"></span>
            </div>
          </div>

          <div class="detail-row" data-hide-empty>
            <div class="detail-icon">
              <img src="bg/icon/voyage.svg" alt="Voyage" />
            </div>
            <div class="detail-content">
              <span class="detail-label" data-label="voyage">Voyage</span>
              <span class="detail-value" data-field="voyage"></span>
            </div>
          </div>

          <div class="detail-row" data-hide-empty>
            <div class="detail-icon">
              <img src="bg/icon/cfs.svg" alt="CFS" />
            </div>
            <div class="detail-content">
              <span class="detail-label" data-label="cfsCutOff">CFS</span>
              <span class="detail-value" data-field="cfs"></span>
            </div>
          </div>

          <div class="detail-row" data-hide-empty>
            <div class="detail-icon">
              <img src="bg/icon/depart.svg" alt="ETD" />
            </div>
            <div class="detail-content">
              <span class="detail-label" data-label="etd">ETD</span>
              <span class="detail-value" data-field="etd"></span>
            </div>
          </div>

          <div class="detail-row" data-hide-empty>
            <div class="detail-icon">
              <img src="bg/icon/arrival.svg" alt="ETA" />
            </div>
            <div class="detail-content">
              <span class="detail-label" data-label="eta">ETA</span>
              <span class="detail-value" data-field="eta"></span>
            </div>
          </div>
        </div>
      </main>

      <!-- Footer -->
      <footer class="flyer-footer">
        <div class="social-item">
          <span class="social-icon">f</span>
          <span class="social-text">PT. ACT Global Freight</span>
        </div>
        <div class="social-item">
          <span class="social-icon">in</span>
          <span class="social-text">ACT Global Freight Official</span>
        </div>
        <div class="social-item">
          <span class="social-icon">ig</span>
          <span class="social-text">actglobalfreight</span>
        </div>
        <div class="social-item">
          <span class="social-icon">tt</span>
          <span class="social-text">lifeatact</span>
        </div>
      </footer>
    </div>
  </div>
</div>
